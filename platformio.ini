; ============================================================================
; Trassar-Painter v7.0.0 - SD-SPEED EDITION
; PlatformIO Configuration
; ============================================================================
; Platforma: ESP32-S3 DevKitC-1 (16MB Flash, 8MB PSRAM)
; Framework: Arduino
;
; WAŻNE: Piny GPIO -> src/pins.h (jedyne źródło prawdy)
;         Piny TFT -> build_flags poniżej (-DTFT_xxx)
;         Karta SD współdzieli SPI z TFT (osobny CS na GPIO 2)
; ============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Board configuration dla ESP32-S3 N16R8 (16MB Flash, 8MB PSRAM)
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.psram_type = opi
board_build.memory_type = opi_opi
board_build.partitions = default_16MB.csv

; Źródło kodu - katalog src/
src_dir = src

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; --- TFT ILI9341 Pin Configuration ---
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=14
    -DTFT_DC=15
    -DTFT_RST=16
    -DTFT_BL=17
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

; Libraries
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/RTClib @ ^2.1.4
    ; SD card - wbudowana w ESP32 Arduino core (nie wymaga osobnej biblioteki)

; Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Upload
upload_speed = 921600
