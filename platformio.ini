; ============================================================================
; Trassar-Painter v7.0.0 - SD-SPEED EDITION
; PlatformIO Configuration
; ============================================================================
; Platforma: ESP32-S3 DevKitC-1 (16MB Flash, 8MB PSRAM)
; Framework: Arduino
;
; WAŻNE: Piny GPIO -> src/pins.h (jedyne źródło prawdy)
;         Piny TFT -> build_flags poniżej (-DTFT_xxx)
;         Karta SD współdzieli SPI z TFT (osobny CS na GPIO 2)
; ============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Board configuration - DOMYŚLNIE dla standardowej płytki ESP32-S3
; Jeśli masz płytkę N16R8 (16MB Flash + 8MB OPI PSRAM), odkomentuj:
;   board_build.psram_type = opi
;   board_build.memory_type = opi_opi
;   w build_flags dodaj: -DBOARD_HAS_PSRAM
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv

; Źródło kodu - katalog src/
src_dir = src

; Build flags - MINIMAL dla testu diagnostycznego
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0

; Libraries - WYŁĄCZONE dla testu diagnostycznego
; lib_deps =
;     bodmer/TFT_eSPI @ ^2.5.43
;     adafruit/RTClib @ ^2.1.4
;     ; SD card - wbudowana w ESP32 Arduino core (nie wymaga osobnej biblioteki)

; Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Upload
upload_speed = 921600
