; ============================================================================
; Trassar-Painter - DIAGNOSTIC BUILD
; ZMIENIONA KONFIGURACJA PŁYTKI
; ============================================================================

[env:esp32s3]
platform = espressif32 @ 6.4.0
board = esp32-s3-devkitc-1
framework = arduino

; ZMIENIONE USTAWIENIA FLASH - możliwe przyczyny crash
board_build.flash_mode = qio
board_build.f_flash = 40000000L
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; WYŁĄCZONY USB CDC - to może powodować problemy!
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1

; Monitor
monitor_speed = 115200

; Upload - wolniejsza prędkość dla stabilności
upload_speed = 460800
